name: TryHackMe Update Badge

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  tryhackme-badge-update:
    name: Update this repo's tryhackme badge with the latest tryhackme image badge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
        with:
          persist-credentials: true
          fetch-depth: 0

      - uses: p4p1/tryhackme-badge-workflow@main
        with:
          username: 'MAHADALIAWAN'
          image_path: './Assets/thm_propic.png'

      - name: Commit and push if badge changed
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "Auto-update TryHackMe badge"
          file_pattern: Assets/thm_propic.png
